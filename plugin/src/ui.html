<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 12px;
        background: #fafafa;
        font-size: 14px;
        line-height: 1.5;
      }
      #status {
        padding: 8px 12px;
        background: #f0f0f0;
        border-radius: 4px;
        font-size: 13px;
        margin-bottom: 12px;
        border-left: 3px solid #999;
      }
      #status.connected {
        background: #e8f5e9;
        border-left-color: #4caf50;
      }
      #status.connecting {
        background: #fff3e0;
        border-left-color: #ff9800;
      }
      #status.error {
        background: #ffebee;
        border-left-color: #f44336;
      }
      .settings-section {
        background: white;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 12px;
        margin-top: 8px;
      }
      .settings-section h3 {
        margin: 0 0 8px 0;
        font-size: 13px;
        font-weight: 600;
        color: #333;
      }
      .setting-row {
        display: flex;
        align-items: center;
        margin-bottom: 8px;
      }
      .setting-row:last-child {
        margin-bottom: 0;
      }
      .setting-label {
        flex: 0 0 50px;
        font-weight: 500;
        color: #666;
      }
      .setting-input {
        flex: 1;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 3px;
        font-size: 13px;
      }
      .setting-input:focus {
        outline: none;
        border-color: #1976d2;
        box-shadow: 0 0 2px rgba(25, 118, 210, 0.3);
      }
      .button-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      #saveButton {
        flex: 1;
        padding: 8px 12px;
        background: #1976d2;
        color: white;
        border: none;
        border-radius: 3px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }
      #saveButton:hover {
        background: #1565c0;
      }
      #saveButton:active {
        background: #0d47a1;
      }
    </style>
  </head>
  <body>
    <div id="status" class="connecting">Loading…</div>

    <div class="settings-section">
      <h3>WebSocket Settings</h3>
      <div class="setting-row">
        <label class="setting-label">Host</label>
        <input
          type="text"
          id="hostInput"
          class="setting-input"
          placeholder="127.0.0.1"
          value="127.0.0.1"
        />
      </div>
      <div class="setting-row">
        <label class="setting-label">Port</label>
        <input
          type="number"
          id="portInput"
          class="setting-input"
          placeholder="1994"
          value="1994"
          min="1"
          max="65535"
        />
      </div>
      <div class="button-row">
        <button id="saveButton">Save & Reconnect</button>
      </div>
    </div>

    <!-- Bundled ui.ts will be inlined here -->
    <!-- SCRIPT -->
  </body>
</html>
